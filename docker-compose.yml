services:
  bot:
    # Published by .github/workflows/docker-image.yml on every push to main.
    # For a locally built image use docker-compose.dev.yml (see README).
    image: ghcr.io/doctorwand/logthelogger:latest
    pull_policy: always
    container_name: logthelogger
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
